# Repaso automático con Lighthouse (Google): velocidad, accesibilidad,
# buenas prácticas y SEO, en versión móvil.
#
# Genera la web de la rama elegida (scripts/build.py), la sirve dentro de la
# propia máquina de GitHub y pasa Lighthouse por las páginas clave. Así se
# puede medir una rama antes de publicarla. No cambia nada de la web: deja
# una tabla con las notas en el resumen de la ejecución y los informes
# completos (HTML y JSON) como artefacto descargable.
#
# Se lanza a mano desde la pestaña Actions ("Run workflow", eligiendo la
# rama) y además el primer día de cada mes, sobre main.

name: Revisar calidad

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"  # día 1 de cada mes a las 6:00 UTC

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      PAGINAS: >-
        index.html
        me-acaban-de-diagnosticar.html
        tratamiento.html
        contacto.html
        agenda.html
        quienes-somos.html
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generar la web
        run: python scripts/build.py

      - name: Servir la web y pasar Lighthouse por cada página
        run: |
          python -m http.server 8000 -d publicar >/dev/null 2>&1 &
          sleep 2
          mkdir -p informes
          for pagina in $PAGINAS; do
            nombre="${pagina%.html}"
            npx -y lighthouse@12.2.1 "http://localhost:8000/$pagina" --quiet \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output=html \
              --output-path="informes/$nombre" || echo "::warning::Lighthouse falló en $pagina"
          done

      - name: Resumen de notas
        run: python scripts/resumen_lighthouse.py informes >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: informes-lighthouse
          path: informes
